name: 每日更新ETF看板
on:
  schedule:
    - cron: '20 7 * * *'   # UTC 07:20 = 北京时间 15:20 收盘后, 每天
    - cron: '45 20 * * *'  # 早场尝试①(北京4:45名义→实测+3h≈7:45-9:00)
    - cron: '15 22 * * *'  # 早场尝试②(北京6:15名义→实测+3h≈9:15)
    - cron: '0 23 * * *'  # 早场 UTC 23:00 = 北京7:00名义, 实际约8:40-9:30 早场
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 运行生成脚本
        run: python etf_rotation.py
      - name: 运行网格看板脚本
        run: python grid_trading.py || echo "grid failed, skip"
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "auto: update ETF dashboard $(date +'%Y-%m-%d %H:%M')" || echo "no changes"
          git push
